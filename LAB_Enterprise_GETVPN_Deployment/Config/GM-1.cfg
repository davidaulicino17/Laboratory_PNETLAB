hostname GM-1
!
crypto isakmp policy 10
 encr aes
 authentication pre-share
 group 14
crypto isakmp key cisco123 address 1.1.1.1
!
crypto gdoi group GETVPN_GROUP
 identity number 1234
 server address ipv4 1.1.1.1
!
crypto map GET_MAP 10 gdoi
 set group GETVPN_GROUP
!
interface GigabitEthernet0/0
 description WAN_TO_CORE
 ip address 10.0.0.6 255.255.255.252
 crypto map GET_MAP
!
interface GigabitEthernet0/1
 description LAN_SITE_A
 ip address 172.16.1.1 255.255.255.0
!
interface Loopback0
 ip address 101.101.101.101 255.255.255.255
!
router ospf 1
 network 10.0.0.4 0.0.0.3 area 0
 network 101.101.101.101 0.0.0.0 area 0
 network 172.16.1.0 0.0.0.255 area 0