hostname KS
!
crypto isakmp policy 10
 encr aes
 authentication pre-share
 group 14
crypto isakmp key cisco123 address 0.0.0.0
!
crypto ipsec transform-set TS_GETVPN esp-aes esp-sha-hmac
 mode transport
!
crypto ipsec profile GETVPN_PROFILE
 set transform-set TS_GETVPN
!
access-list 101 permit ip 172.16.0.0 0.0.255.255 172.16.0.0 0.0.255.255
!
crypto gdoi group GETVPN_GROUP
 identity number 1234
 server local
  rekey authentication mypubkey rsa GETVPN_KEY
  rekey transport unicast
  sa ipsec 1
   profile GETVPN_PROFILE
   match address 101
   replay window size 64
!
interface Loopback0
 ip address 1.1.1.1 255.255.255.255
!
interface GigabitEthernet0/0
 ip address 192.168.100.1 255.255.255.0
 no shutdown
!
router ospf 1
 network 1.1.1.1 0.0.0.0 area 0
 network 192.168.100.0 0.0.0.255 area 0